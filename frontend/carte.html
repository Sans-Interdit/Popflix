<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popflix - Le Popcorn du Binge-Watch</title>
  <link rel="stylesheet" href="carte.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <span>POPFLIX</span>
        <img src="/data/images/logo_popflix.png" alt="Logo POPFLIX" class="logo-img">
      </div>
      <div class="slogan">LE POPCORN DU BINGE-WATCH</div>
    </div>
    <nav class="main-nav" aria-label="Menu principal">
      <div class="nav-top">
        <button id="logout-btn" class="btn-logout" title="Se déconnecter" aria-label="Se déconnecter">
          <span class="logout-label">Se déconnecter</span>
        </button>
      </div>

      <div class="nav-bottom">
        <a class="nav-item" href="index.html">ACCUEIL</a>
        <a class="nav-item" href="watchlist.html">MA WATCHLIST</a>
        <a class="nav-item" href="wishlist.html">MA WISHLIST</a>
        <a class="nav-item" href="bibliotheque.html">TOUTE LA BIBLIOTHÈQUE</a>
        <a class="nav-item" href="compte.html">MON COMPTE</a>
        <a class="nav-item" href="contact.html">CONTACT</a>
      </div>
    </nav>
  </header>

  <div class="content-wrapper">
    <div class="movie-container">
      <!-- Affiche -->
      <div class="poster-section">
        <img id="poster" src="" alt="Affiche" width="400" draggable="false">
      </div>

      <!-- Infos détaillées -->
      <div class="info-section">
        <!-- Type -->
        <div class="info-item">
          <div class="container">
            <div class="type" data-field="type">Film</div>
          </div>
        </div>

        <!-- Titre -->
        <h2 class="info-value" data-field="title">Titre de l'œuvre</h2>

        <!-- Année -->
        <div class="info-item">
          <div class="info-label">Année :</div>
          <div class="info-value" data-field="release_date">—</div>
        </div>

        <!-- Genres -->
        <div class="info-item">
          <div class="info-label">Genres :</div>
          <div class="info-value" data-field="genres">—</div>
        </div>

        <!-- Réalisateur(s) -->
        <div class="info-item">
          <div class="info-label">Réalisateur :</div>
          <div class="info-value" data-field="director">—</div>
        </div>

        <!-- Acteurs principaux -->
        <div class="info-item">
          <div class="info-label">Acteurs :</div>
          <div class="info-value" data-field="actors">—</div>
        </div>

        <!-- Synopsis long -->
        <div class="info-item">
          <div class="info-label">Synopsis :</div>
          <div class="info-value" data-field="overview">
            —
          </div>
        </div>
      </div>

      <!-- Interactions / Note -->
      <div class="rating-section">
        <button class="watched-btn">
          <span class="watched-text">J'ai vu cette œuvre</span>
        </button>

        <button class="wished-btn">
          <span class="wished-text">Ajouter à la wishlist</span>
        </button>

        <div>
          <div><span class="rating-label">MON AVIS</span></div>
          <div class="stars" aria-label="Noter cette œuvre">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
          </div>
        </div>

        <button class="return-btn">RETOUR A MA WATCHLIST</button>
      </div>
    </div>
  </div>

  <script src="carte.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await me();
        if (user) document.getElementById('logout-btn').hidden = false;
      } catch (_) {}
    });

    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      try {
        await logout();
        localStorage.setItem('LOGOUT_BROADCAST', String(Date.now()));
      } finally {
        window.location.href = 'compte.html';
      }
    });

    window.addEventListener('storage', (ev) => {
      if (ev.key === 'LOGOUT_BROADCAST') {
        window.location.href = 'compte.html';
      }
    });
  </script>
</body>
</html>
