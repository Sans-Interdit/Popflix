<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POPFLIX — Ma Watchlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <span>POPFLIX</span>
        <img src="/data/images/logo_popflix.png" alt="Logo POPFLIX" class="logo-img">
      </div>

      <div class="slogan">LE POPCORN DU BINGE-WATCH</div>
    </div>

    <nav class="main-nav">
      <a class="nav-item active" href="#" data-view="watchlist">MA WATCHLIST</a>
      <a class="nav-item" href="#" data-view="wishlist">MA WISHLIST</a>
      <a class="nav-item" href="#" data-view="search">RECHERCHER</a>
      <a class="nav-item" href="#" data-view="account">MON COMPTE</a>
    </nav>
  </header>

  <!-- Filtres -->
<section class="filters">
  <h2>MA WATCHLIST</h2>
  <div class="filters-right">
    <button class="filtre active" data-type="series">SÉRIES</button>
    <button class="filtre" data-type="films">FILMS</button>
    <button class="filtre" data-state="started">COMMENCÉS</button>
    <button class="filtre" data-state="done">TERMINÉS</button>
    <div class="recherche">
      <label for="q">TITRE :</label>
      <input id="q" class="input" type="text" placeholder="Rechercher un titre…" />
    </div>
  </div>
</section>


  <!-- Cartes -->
  <main class="content"></main>
    <div id="cards" class="cards-grid">
    </div>
  </main>

  <script src="logic.js"></script>
</body>
</html>
